
spring.application.name=pms

# PostgreSQL Database
spring.datasource.url=${PMS_DB_URL:jdbc:postgresql://localhost:5432/project_management_db}
spring.datasource.username=${PMS_DB_USERNAME:pms_app}
spring.datasource.password=${PMS_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PMS_SECURE_COOKIE:true}

# Error Configuration
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Application Settings
pms.timezone=${PMS_TIMEZONE:Africa/Nairobi}
pms.currency=${PMS_CURRENCY:KES}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
