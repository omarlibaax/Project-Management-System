spring.application.name=pms
spring.datasource.url=${PMS_DB_URL:jdbc:postgresql://localhost:5432/project_management_db}
spring.datasource.username=${PMS_DB_USERNAME:pms_app}
spring.datasource.password=${PMS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PMS_SECURE_COOKIE:true}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
pms.timezone=${PMS_TIMEZONE:Africa/Nairobi}
pms.currency=${PMS_CURRENCY:KES}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB